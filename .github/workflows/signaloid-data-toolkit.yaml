on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

env:
  POETRY_CACHE_DIR: ~/.cache/pypoetry

jobs:
  run:
    strategy:
      matrix:
        args:
          - host: ubuntu-26.04
          - host: macos-26
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on:  ${{ matrix.args.host }}

    env:
      LOGLEVEL: info

    steps:
    - name: Checkout the PR branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        fetch-tags: true

    - name: Debug
      run: |
        echo "github.event_name:" ${{ github.event_name }}
        echo "github.event.pull_request.head.sha:" ${{ github.event.pull_request.head.sha }}
        echo "github.sha:" ${{ github.sha }}
        echo "github.event.release.tag_name:" ${{ github.event.release.tag_name }}
        echo "contains(github.event.pull_request.labels.*.name, 'ci:upload-binaries'):" ${{ contains(github.event.pull_request.labels.*.name, 'ci:upload-binaries') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry Action
      # The same major version that wrote poetry.lock (lock-version 2.1),
      # which Poetry 1 cannot read.
      run: python -m pip install poetry==2.3.2

    - name: Print Poetry version
      run: poetry --version

    - name: List Current Directory
      run: ls

    - name: Install
      run: poetry install

    - name: Install Poetry plugins
      run: poetry self add "poetry-dynamic-versioning[plugin]>=1.0.0,<2.0.0"

    - name: Print Python Information
      run: |
        which python
        pip freeze

    - name: Lint
      run: poetry run flake8 src/

    - name: Check format
      run: poetry run black --check src/

    - name: Typecheck
      # Run mypy just once on the oldest supported Python version
      if: ${{ matrix.args.host == 'ubuntu-26.04' && matrix.python-version == '3.10' }}
      run: poetry run mypy -p signaloid

    - name: Test
      run: poetry run pytest

    - name: Build
      run: poetry build

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: "test-logs-${{matrix.args.host}}-py${{ matrix.python-version }}-${{ github.event.pull_request.head.sha || github.sha }}"
        path: |
          ./src/signaloid/distributional_information_plotting/tests/testdata/Brown-Ham-model-actual-results_df.csv

    - name: Upload wheels
      if: ${{ startsWith(matrix.args.host, 'ubuntu') && matrix.python-version == '3.11' }}
      uses: actions/upload-artifact@v7
      with:
        name: "wheel-${{ github.event.pull_request.head.sha || github.sha }}"
        path: |
          ./dist/*

    # Upload the artifact to the GitHub release
    - name: Upload Release Asset
      if: ${{ github.event_name == 'release' && startsWith(matrix.args.host, 'ubuntu') && matrix.python-version == '3.11' }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} dist/*
      env:
        GITHUB_TOKEN: ${{ github.token }}

  # The CircuitPython code (signaloid.circuitpython, and the distributional and
  # plotting modules it uses) runs on a MicroPython core with ulab, which have only
  # part of the standard library and of NumPy. Check that it compiles with
  # CircuitPython's mpy-cross, and that the plotting path of the Cardputer demo
  # runs in a CircuitPython emulator (see .github/circuitpython/README.md).
  circuitpython:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout the PR branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}

    - name: Restore the CircuitPython emulator
      uses: actions/cache@v6
      with:
        path: ~/circuitpython-emulator/bin
        key: circuitpython-emulator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/circuitpython/setup-emulator.sh') }}

    - name: Build the CircuitPython emulator
      run: bash .github/circuitpython/setup-emulator.sh ~/circuitpython-emulator

    - name: Compile with CircuitPython's mpy-cross
      working-directory: src
      run: |
        find signaloid/circuitpython signaloid/distributional signaloid/distributional_information_plotting \
          -name '*.py' -not -name '*_test.py' | while read -r file; do
          ~/circuitpython-emulator/bin/mpy-cross -o /dev/null "$file" || exit 1
        done

    - name: Plot in the CircuitPython emulator
      run: ~/circuitpython-emulator/bin/micropython -X heapsize=64M .github/circuitpython/check_plotting.py src

  # Publish the built wheels to PyPI
  publish:
    needs: run
    if: ${{ github.event_name == 'release' && github.repository == 'signaloid/signaloid-data-toolkit' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
